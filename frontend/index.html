<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23E05A47' stroke-width='2'><path d='M3 3h18v18H3z'/><path d='m9 9 6 6m0-6-6 6'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SketchTrack — Taller de Planificación y Estudio Autodidacta</title>
    
    <!-- Google Fonts: Shantell Sans (Sketch), DM Sans (Body), Fira Code (Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Fira+Code:wght@400;500;600&family=Shantell+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-st-mat-bg text-st-ink-primary font-sans antialiased overflow-hidden select-none">
    <div id="root"></div>

    <!-- Organic Ink SVG Filters for Hand-drawn touches -->
    <svg class="hidden" aria-hidden="true">
      <defs>
        <filter id="sketch-filter" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
